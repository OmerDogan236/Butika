# Butika production nginx vhosts.
# Local'den /opt/butika/infra/nginx/butika.conf → server /etc/nginx/conf.d/butika.conf
# (sunucuya kopyalanıp nginx -t + reload ile etkinleştirilir).

# ─── api.butika.ai ───────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.butika.ai admin.butika.ai cdn.butika.ai butika.ai www.butika.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.butika.ai;

    ssl_certificate     /etc/nginx/ssl/butika.crt;
    ssl_certificate_key /etc/nginx/ssl/butika.key;
    include /etc/nginx/conf.d/ssl-params.conf;
    include /etc/nginx/conf.d/cloudflare-ips.conf;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cloudflare ülke tespiti — localization pazar çözümlemesi için API'ye geçir.
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

# ─── admin.butika.ai ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.butika.ai;

    ssl_certificate     /etc/nginx/ssl/butika.crt;
    ssl_certificate_key /etc/nginx/ssl/butika.key;
    include /etc/nginx/conf.d/ssl-params.conf;
    include /etc/nginx/conf.d/cloudflare-ips.conf;

    client_max_body_size 10m;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

# ─── butika.ai apex + www — statik landing page ─────────────────────────────
# Dosyalar /var/www/butika-landing altında (landing sayfası bu repoda yer almaz).
# default_server: match olmayan host header'ları da buraya düşer.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name butika.ai www.butika.ai _;

    ssl_certificate     /etc/nginx/ssl/butika.crt;
    ssl_certificate_key /etc/nginx/ssl/butika.key;
    include /etc/nginx/conf.d/ssl-params.conf;
    include /etc/nginx/conf.d/cloudflare-ips.conf;

    root /var/www/butika-landing;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Butik linkleri: /b/<butik-adi> → tek sayfa (butika-landing/b/index.html) adı okuyup
    # uygulamayı ya da mağazayı açar. butikler.json olduğu gibi verilir.
    location ^~ /b/ {
        try_files $uri /b/index.html;
    }

    # Uygulama bağlantı dosyaları (iPhone Universal Links, Android App Links): JSON olarak,
    # yönlendirmesiz verilmeli. Apple dosyasının uzantısı yok.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        try_files $uri =404;
    }
    location = /.well-known/assetlinks.json {
        default_type application/json;
        try_files $uri =404;
    }

    # statik asset'ler uzun cache (index.html cache'lenmez → güncel kalır)
    location ~* \.(?:css|js|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}

# ─── cdn.butika.ai → MinIO ──────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cdn.butika.ai;

    ssl_certificate     /etc/nginx/ssl/butika.crt;
    ssl_certificate_key /etc/nginx/ssl/butika.key;
    include /etc/nginx/conf.d/ssl-params.conf;
    include /etc/nginx/conf.d/cloudflare-ips.conf;

    # MinIO upload boyutu (kapak görseli 4MB civarı yeterli)
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
